# -----------------------------------------------------------------------------
# Deploy the portfolio to GitHub Pages.
#
# This workflow stays dormant until you ENABLE Pages on the repo:
#   GitHub repo  ->  Settings  ->  Pages  ->  Build and deployment
#   ->  Source: "GitHub Actions"
#
# It only runs on pushes to `main`. Until Pages is enabled the deploy step
# simply won't have anywhere to publish, so nothing goes public by accident.
# -----------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, upload
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
